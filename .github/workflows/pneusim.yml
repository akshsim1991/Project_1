name: PneuSim

on:
  push:
    paths: ["PneuSim/**", "PneuSim.Tests/**", ".github/workflows/pneusim.yml"]
  pull_request:
    paths: ["PneuSim/**", "PneuSim.Tests/**", ".github/workflows/pneusim.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, tests + package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build PneuSim (Release)
        run: dotnet build PneuSim/PneuSim.vbproj -c Release

      - name: Simulation tests
        working-directory: PneuSim.Tests
        shell: pwsh
        run: |
          dotnet build PneuSim.Tests.vbproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory test-run -Force | Out-Null
          Push-Location test-run
          & ..\bin\Release\net472\PneuSim.Tests.exe
          $failures = $LASTEXITCODE
          Pop-Location
          if ($failures -ne 0) { Write-Error "$failures test(s) failed"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/PneuSim"
          New-Item -ItemType Directory "$dist/Examples", "$dist/Generated examples" -Force | Out-Null
          Copy-Item PneuSim/bin/Release/net472/PneuSim.exe, PneuSim/bin/Release/net472/PneuSim.exe.config $dist
          Copy-Item PneuSim/README.md $dist
          $out = "PneuSim.Tests/test-run/out"
          Copy-Item "$out/ex*.pneu" "$dist/Examples"
          Copy-Item "$out/electro_*.pneu", "$out/cascade_*.pneu" "$dist/Generated examples"
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      # Optional code signing. Add two repository secrets to enable it:
      #   SIGNING_CERT_BASE64   - your code-signing certificate (.pfx) encoded as base64
      #   SIGNING_CERT_PASSWORD - the password of the .pfx
      # Without them the EXE and installer are built unsigned.
      - name: Sign PneuSim.exe
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) { Write-Host "No signing certificate configured; skipping."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "pneusim.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/PneuSim/PneuSim.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGNTOOL=$($signtool.FullName)" | Out-File $env:GITHUB_ENV -Append
          "PFX=$pfx" | Out-File $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $src = (Resolve-Path dist/PneuSim).Path
          New-Item -ItemType Directory dist/installer -Force | Out-Null
          $outDir = (Resolve-Path dist/installer).Path
          & $iscc "/DSourceDir=$src" "/DOutputDir=$outDir" PneuSim/installer/PneuSim.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGNTOOL) {
            Get-ChildItem dist/installer/*.exe | ForEach-Object {
              & $env:SIGNTOOL sign /f $env:PFX /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Get-ChildItem dist/installer

      - uses: actions/upload-artifact@v4
        with:
          name: PneuSim-Windows
          path: dist/PneuSim/

      - uses: actions/upload-artifact@v4
        with:
          name: PneuSim-Setup
          path: dist/installer/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PneuSim-test-renders
          path: PneuSim.Tests/test-run/out/*.png
          if-no-files-found: ignore
