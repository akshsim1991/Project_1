name: PixelBlend

on:
  push:
    paths: ["PixelBlend/**", ".github/workflows/pixelblend.yml"]
  pull_request:
    paths: ["PixelBlend/**", ".github/workflows/pixelblend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build + installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PixelBlend
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild PixelBlend.sln /p:Configuration=Release "/p:Platform=Any CPU" /m /v:minimal /warnaserror

      - name: Package portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\Release\PixelBlend.exe, bin\Release\PixelBlend.exe.config dist\
          Get-ChildItem dist

      - name: Smoke test (the app must start and show its window)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PixelBlend.exe -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "PixelBlend exited during start-up with code $($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } |
              ForEach-Object { Write-Host "---- $($_.ProviderName)"; Write-Host $_.Message }
            exit 1
          }
          $crashLog = "$env:LOCALAPPDATA\PixelBlend\crash.log"
          $title = $p.MainWindowTitle
          Stop-Process -Id $p.Id -Force
          if (Test-Path $crashLog) { Write-Host "PixelBlend reported an error:"; Get-Content $crashLog; exit 1 }
          if ($title -notlike '*Collage Maker*') { Write-Host "Main window not shown (window title: '$title')"; exit 1 }
          Write-Host "PixelBlend started correctly. Window title: '$title'"

      - name: Smoke test (open 3 images of different sizes)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $dir = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\pb-images"
          $specs = @(@(640, 480, 'Red', 'jpg'), @(300, 500, 'Green', 'png'), @(800, 800, 'Blue', 'bmp'))
          $files = foreach ($s in $specs) {
            $bmp = New-Object System.Drawing.Bitmap $s[0], $s[1]
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::FromName($s[2])); $g.Dispose()
            $path = Join-Path $dir "$($s[2]).$($s[3])"
            $bmp.Save($path); $bmp.Dispose(); $path
          }
          $crashLog = "$env:LOCALAPPDATA\PixelBlend\crash.log"
          Remove-Item $crashLog -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\PixelBlend.exe -ArgumentList ($files | ForEach-Object { "`"$_`"" }) -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          $exited = $p.HasExited
          $title = if ($exited) { '' } else { $p.MainWindowTitle }
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $crashLog) { Write-Host "PixelBlend reported an error:"; Get-Content $crashLog; exit 1 }
          if ($exited) { Write-Host "PixelBlend exited with code $($p.ExitCode)"; exit 1 }
          if ($title -notlike '*Collage Maker*') { Write-Host "Main window not shown (window title: '$title')"; exit 1 }
          Write-Host "Opened 3 images without errors."

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer\PixelBlend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBlend-portable
          path: PixelBlend/dist

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBlend-installer
          path: PixelBlend/installer/Output/*.exe
