name: Feather CAD

on:
  push:
    paths: ["FeatherCAD/**", ".github/workflows/feathercad.yml"]
  pull_request:
    paths: ["FeatherCAD/**", ".github/workflows/feathercad.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows x64 (MSVC) + tests + installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FeatherCAD
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DFEATHERCAD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: build\Release\CoreTests.exe

      - name: Start-up test (opens the window, draws, undoes and closes)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $crash = "$env:LOCALAPPDATA\FeatherCAD\crash.txt"
          Remove-Item $crash -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath build\Release\FeatherCAD.exe -PassThru
          Start-Sleep -Seconds 8
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name")
          }
          if (Test-Path $crash) { Get-Content $crash; Shot "smoke-crash.png"; $p.Kill(); exit 1 }
          if ($p.HasExited) { Write-Host "Feather CAD exited at start-up with code $($p.ExitCode)"; exit 1 }
          $p.Refresh()
          if ($p.MainWindowHandle -eq 0) { Write-Host "No window appeared"; Shot "smoke-nowindow.png"; $p.Kill(); exit 1 }
          Write-Host "Window: $($p.MainWindowTitle)"
          $shell = New-Object -ComObject WScript.Shell
          $null = $shell.AppActivate($p.Id)
          Start-Sleep -Milliseconds 500
          foreach ($k in @("rec{ENTER}", "0,0{ENTER}", "200,120{ENTER}", "c{ENTER}", "100,60{ENTER}", "40{ENTER}")) {
            [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep -Milliseconds 300
          }
          Start-Sleep -Seconds 1
          Shot "smoke.png"
          if (Test-Path $crash) { Get-Content $crash; $p.Kill(); exit 1 }
          if ($p.HasExited) { Write-Host "Feather CAD stopped while drawing (code $($p.ExitCode))"; exit 1 }
          # Undo both objects, so closing does not ask to save.
          foreach ($k in @("u{ENTER}", "u{ENTER}")) { [System.Windows.Forms.SendKeys]::SendWait($k); Start-Sleep -Milliseconds 300 }
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) { Write-Host "Feather CAD did not close"; Shot "smoke-close.png"; $p.Kill(); exit 1 }
          Write-Host "Closed normally, exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FeatherCAD-startup-screenshots
          path: FeatherCAD/smoke*.png
          if-no-files-found: ignore

      - name: Package portable folder
        run: cmake --install build --config Release --prefix dist

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer\FeatherCAD.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: FeatherCAD-portable-x64
          path: FeatherCAD/dist

      - uses: actions/upload-artifact@v4
        with:
          name: FeatherCAD-installer-x64
          path: FeatherCAD/installer/Output/*.exe

  linux:
    name: Unit tests (Linux, sanitizers) + MinGW-w64 cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FeatherCAD
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests with address and undefined-behaviour sanitizers
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Isrc tests/CoreTests.cpp src/Geometry.cpp src/Entity.cpp src/Document.cpp src/Snap.cpp \
            src/Engine.cpp src/Commands.cpp -o coretests
          ./coretests
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
